name: TikTok Bot Runner

on:
  schedule:
    - cron: '*/20 * * * *' # በየ 20 ደቂቃው ራሱን ይቀሰቅሳል
  workflow_dispatch: # በእጅህ ለማስጀመር

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }} # ይህ ለደህንነት ነው
        run: run: python main.py
